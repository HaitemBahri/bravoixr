name: Linear Release

on:
  push:
    tags:
      - 'bravoixr/v*'

permissions:
  contents: read

jobs:
  linear-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#bravoixr/}" >> "$GITHUB_OUTPUT"

      - name: Load Linear access key from 1Password
        id: op
        uses: 1password/load-secrets-action@v2
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          LINEAR_ACCESS_KEY: op://Dev/Linear/credential

      - name: Sync Linear release
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ steps.op.outputs.LINEAR_ACCESS_KEY }}
          name: bravoixr ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          include_paths: apps/bravoixr/**

      - name: Complete Linear release
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ steps.op.outputs.LINEAR_ACCESS_KEY }}
          command: complete
          version: ${{ steps.version.outputs.version }}