<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bravoixr — button</title>

  <script>
    (function () {
      var t = localStorage.getItem('bravoixr-theme') || 'light';
      var l = localStorage.getItem('bravoixr-lang') || 'en';
      var r = document.documentElement;
      r.setAttribute('data-theme', t);
      if (l === 'ar') { r.setAttribute('dir', 'rtl'); r.setAttribute('lang', 'ar'); }
      else { r.setAttribute('dir', 'ltr'); r.setAttribute('lang', 'en'); }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">

  <link rel="stylesheet" href="../../index.css">
  <link rel="stylesheet" href="../preview.css">
</head>
<body>
  <header class="pv-header">
    <span class="pv-brand">bravoixr</span>
    <div class="pv-controls">
      <button class="pv-btn" type="button" data-toggle="theme">☾ Dark</button>
      <button class="pv-btn" type="button" data-toggle="lang">ع</button>
    </div>
  </header>

  <main class="pv-main">
    <section class="pv-section">
      <h2 style="font-family:var(--font-heading);font-weight:var(--weight-page-title);font-size:var(--text-section-title);margin:0 0 var(--spacing-3)" data-en="Button" data-ar="زر">Button</h2>
      <p class="pv-lede" data-en="One primary intent in two fills — solid and text — each as a normal button that hugs its label or a square icon button. Hover, press, and tab to see the states; the last of each pair is disabled." data-ar="نيّة أساسية واحدة بامتلاءين — ممتلئ ونصّي — كلٌّ كزرّ عادي يحتضن نصّه أو كزرّ أيقونة مربّع. مرّر، اضغط، وانتقل بالـ Tab لرؤية الحالات؛ والأخير في كل زوج معطّل.">One primary intent in two fills — solid and text — each as a normal button that hugs its label or a square icon button. Hover, press, and tab to see the states; the last of each pair is disabled.</p>

      <!-- Normal buttons: solid + text, resting and disabled. -->
      <div class="pv-row" style="margin-top:var(--spacing-7)">
        <button class="btn btn-solid" type="button" data-en="Solid" data-ar="ممتلئ">Solid</button>
        <button class="btn btn-text" type="button" data-en="Text" data-ar="نصّي">Text</button>
        <button class="btn btn-solid" type="button" disabled data-en="Solid disabled" data-ar="ممتلئ معطّل">Solid disabled</button>
        <button class="btn btn-text" type="button" disabled data-en="Text disabled" data-ar="نصّي معطّل">Text disabled</button>
      </div>

      <!-- Square icon buttons: solid + text, resting and disabled. -->
      <div class="pv-row" style="margin-top:var(--spacing-6)">
        <button class="btn btn-solid btn-square" type="button" aria-label="Add"><span class="pv-symbol" style="font-size:var(--icon-md);color:inherit">add</span></button>
        <button class="btn btn-text btn-square" type="button" aria-label="Favorite"><span class="pv-symbol" style="font-size:var(--icon-md);color:inherit">favorite</span></button>
        <button class="btn btn-solid btn-square" type="button" disabled aria-label="Add"><span class="pv-symbol" style="font-size:var(--icon-md);color:inherit">add</span></button>
        <button class="btn btn-text btn-square" type="button" disabled aria-label="Favorite"><span class="pv-symbol" style="font-size:var(--icon-md);color:inherit">favorite</span></button>
      </div>
    </section>
  </main>

  <script src="../preview.js"></script>
</body>
</html>
