<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bravoixr — input</title>

  <script>
    (function () {
      var t = localStorage.getItem('bravoixr-theme') || 'light';
      var l = localStorage.getItem('bravoixr-lang') || 'en';
      var r = document.documentElement;
      r.setAttribute('data-theme', t);
      if (l === 'ar') { r.setAttribute('dir', 'rtl'); r.setAttribute('lang', 'ar'); }
      else { r.setAttribute('dir', 'ltr'); r.setAttribute('lang', 'en'); }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">

  <link rel="stylesheet" href="../../index.css">
</head>
<body class="page text-body">
  <div class="page-topbar">
    <span class="text-project-title">bravoixr</span>
    <div class="page-controls">
      <button class="btn btn-solid btn-square" type="button" data-toggle="theme" aria-label="Toggle theme"><span class="icon icon-md">contrast</span></button>
      <button class="btn btn-solid btn-square" type="button" data-toggle="lang" aria-label="Toggle language"><span class="icon icon-md">translate</span></button>
    </div>
  </div>

  <main class="page-body">

    <section class="page-section">
      <h2 class="text-page-title" data-en="Input" data-ar="حقل إدخال">Input</h2>
      <p class="text-page-description text-color-description" data-en="Full-width text field with a just-visible border. Click in and the border becomes the 2px brand focus ring — with no layout shift." data-ar="حقل نصي بعرض كامل بحدّ واضح بالكاد. انقر بداخله فيتحوّل الحدّ إلى حلقة تركيز باللون الأساسي بسماكة 2 بكسل — دون أي إزاحة في التخطيط.">Full-width text field with a just-visible border. Click in and the border becomes the 2px brand focus ring — with no layout shift.</p>

      <div class="page-section">
        <input class="input" type="text" placeholder="Type something…" data-en="Type something…" data-ar="اكتب شيئًا…">
        <input class="input" type="text" placeholder="Another field" data-en="Another field" data-ar="حقل آخر">
      </div>
    </section>

  </main>

  <footer class="page-footer">
    <span class="text-body text-color-description" data-en="bravoixr · © 2026" data-ar="bravoixr · © ٢٠٢٦">bravoixr · © 2026</span>
    <span class="text-body text-color-description">v0.1.0</span>
  </footer>

  <script src="../preview.js"></script>
</body>
</html>
