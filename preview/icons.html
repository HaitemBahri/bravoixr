<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bravoixr — icons</title>

  <script>
    (function () {
      var t = localStorage.getItem('bravoixr-theme') || 'light';
      var l = localStorage.getItem('bravoixr-lang') || 'en';
      var r = document.documentElement;
      r.setAttribute('data-theme', t);
      if (l === 'ar') { r.setAttribute('dir', 'rtl'); r.setAttribute('lang', 'ar'); }
      else { r.setAttribute('dir', 'ltr'); r.setAttribute('lang', 'en'); }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">

  <link rel="stylesheet" href="../index.css">
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <header class="pv-header">
    <span class="pv-brand">bravoixr</span>
    <div class="pv-controls">
      <button class="pv-btn" type="button" data-toggle="theme">☾ Dark</button>
      <button class="pv-btn" type="button" data-toggle="lang">ع</button>
    </div>
  </header>

  <main class="pv-main">
    <h2 style="font-family:var(--font-heading);font-weight:var(--weight-page-title);font-size:var(--text-section-title);margin:0 0 var(--spacing-6)" data-en="Icons" data-ar="الأيقونات">Icons</h2>

    <section class="pv-section">
      <h3 data-en="Material Symbols (themed grade)" data-ar="رموز Material (درجة متغيّرة)">Material Symbols (themed grade)</h3>
      <div class="pv-icon-row">
        <span class="pv-symbol" style="font-size:var(--icon-sm)">home</span>
        <span class="pv-symbol" style="font-size:var(--icon-md)">favorite</span>
        <span class="pv-symbol" style="font-size:var(--icon-lg)">settings</span>
        <span class="pv-symbol" style="font-size:var(--icon-xl)">search</span>
        <span class="pv-symbol" style="font-size:var(--icon-xl);font-variation-settings:'wght' var(--icon-weight),'FILL' 1,'opsz' var(--icon-optical),'GRAD' var(--icon-grade)">favorite</span>
      </div>
      <p class="pv-mono">sm · md · lg · xl · (filled)</p>
    </section>
  </main>

  <script src="preview.js"></script>
</body>
</html>
