<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bravoixr — color</title>

  <script>
    (function () {
      var t = localStorage.getItem('bravoixr-theme') || 'light';
      var l = localStorage.getItem('bravoixr-lang') || 'en';
      var r = document.documentElement;
      r.setAttribute('data-theme', t);
      if (l === 'ar') { r.setAttribute('dir', 'rtl'); r.setAttribute('lang', 'ar'); }
      else { r.setAttribute('dir', 'ltr'); r.setAttribute('lang', 'en'); }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">

  <link rel="stylesheet" href="../../index.css">
</head>
<body class="page text-body">
  <div class="page-topbar">
    <span class="text-project-title">bravoixr</span>
    <div class="page-controls">
      <button class="btn btn-solid btn-square" type="button" data-toggle="theme" aria-label="Toggle theme"><span class="icon icon-md">contrast</span></button>
      <button class="btn btn-solid btn-square" type="button" data-toggle="lang" aria-label="Toggle language"><span class="icon icon-md">translate</span></button>
    </div>
  </div>

  <main class="page-body">

    <section class="page-section">
      <h2 class="text-page-title" data-en="Color" data-ar="اللون">Color</h2>
      <p class="text-page-description text-color-description" data-en="Eleven-step ramps (50–950) for brand, status, and accent hues; the cool-gray neutral runs 0–1000." data-ar="تدرّجات من 11 درجة (50–950) لألوان العلامة والحالات واللمسات؛ والمحايد الرمادي البارد يمتدّ من 0 إلى 1000.">Eleven-step ramps (50–950) for brand, status, and accent hues; the cool-gray neutral runs 0–1000.</p>
    </section>

    <!-- Each hue is a page-row-header (name-only rail + its swatch cluster). The
         rows are grid-gapped since page-row-headers carry no inter-row margin. -->
    <div id="ramps" style="display: grid; gap: var(--spacing-5);"></div>

  </main>

  <footer class="page-footer">
    <span class="text-body text-color-description" data-en="bravoixr · © 2026" data-ar="bravoixr · © ٢٠٢٦">bravoixr · © 2026</span>
    <span class="text-body text-color-description">v0.1.0</span>
  </footer>

  <script>
    (function () {
      var hues = {
        neutral: [0, 50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950, 1000],
        blue: [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950],
        teal: [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950],
        green: [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950],
        yellow: [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950],
        red: [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950],
        purple: [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950],
        pink: [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950]
      };
      var ramps = document.getElementById('ramps');
      Object.keys(hues).forEach(function (hue) {
        // One page-row-header per hue: a name-only rail beside the swatch cluster.
        var section = document.createElement('div');
        section.className = 'page-row-header';

        var railCell = document.createElement('div');
        var title = document.createElement('h3');
        title.className = 'page-row-header-title';
        title.textContent = hue;
        railCell.appendChild(title);
        section.appendChild(railCell);

        // The swatches: .card divs grouped in a page-cluster; the only inline
        // style is the swatch fill (plus the 100×100 demo size).
        var contentCell = document.createElement('div');
        var cluster = document.createElement('div');
        cluster.className = 'page-cluster';
        hues[hue].forEach(function (step) {
          // Each swatch is a page-column-header: the carded fill on top, the
          // level as a centred caption beneath it.
          var column = document.createElement('div');
          column.className = 'page-column-header';
          var card = document.createElement('div');
          card.className = 'card';
          card.style.cssText = 'inline-size:100px;block-size:100px';
          card.style.background = 'var(--' + hue + '-' + step + ')';
          var caption = document.createElement('span');
          caption.className = 'text-label';
          caption.textContent = step;
          column.appendChild(card);
          column.appendChild(caption);
          cluster.appendChild(column);
        });
        contentCell.appendChild(cluster);
        section.appendChild(contentCell);

        ramps.appendChild(section);
      });
    })();
  </script>
  <script src="../preview.js"></script>
</body>
</html>
