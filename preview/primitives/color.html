<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bravoixr — color</title>

  <script>
    (function () {
      var t = localStorage.getItem('bravoixr-theme') || 'light';
      var l = localStorage.getItem('bravoixr-lang') || 'en';
      var r = document.documentElement;
      r.setAttribute('data-theme', t);
      if (l === 'ar') { r.setAttribute('dir', 'rtl'); r.setAttribute('lang', 'ar'); }
      else { r.setAttribute('dir', 'ltr'); r.setAttribute('lang', 'en'); }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">

  <link rel="stylesheet" href="../../index.css">
  <link rel="stylesheet" href="../preview.css">
</head>
<body class="page text-body">
  <main style="max-inline-size:var(--container-max);margin-inline:auto;padding:var(--spacing-8) var(--spacing-6) var(--spacing-12)">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--spacing-5);margin-block-end:var(--spacing-8)">
      <span class="text-project-title">bravoixr</span>
      <div style="display:flex;gap:var(--spacing-3)">
        <button class="btn btn-solid btn-square" type="button" data-toggle="theme" aria-label="Toggle theme"><span class="icon icon-md">contrast</span></button>
        <button class="btn btn-solid btn-square" type="button" data-toggle="lang" aria-label="Toggle language"><span class="icon icon-md">translate</span></button>
      </div>
    </div>

    <h2 class="text-section-title" style="margin:0 0 var(--spacing-6)" data-en="Color" data-ar="اللون">Color</h2>

    <section style="margin-block-end:var(--spacing-10)">
      <p class="text-page-description text-color-description" style="max-inline-size:60ch" data-en="Eleven-step ramps (50–950) for brand, status, and accent hues; the cool-gray neutral runs 0–1000." data-ar="تدرّجات من 11 درجة (50–950) لألوان العلامة والحالات واللمسات؛ والمحايد الرمادي البارد يمتدّ من 0 إلى 1000.">Eleven-step ramps (50–950) for brand, status, and accent hues; the cool-gray neutral runs 0–1000.</p>
      <div id="ramps" style="margin-block-start:var(--spacing-5)"></div>
    </section>
  </main>

  <script>
    (function () {
      var hues = {
        neutral: [0, 50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950, 1000],
        blue: [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950],
        teal: [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950],
        green: [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950],
        yellow: [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950],
        red: [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950],
        purple: [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950],
        pink: [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950]
      };
      var ramps = document.getElementById('ramps');
      Object.keys(hues).forEach(function (hue) {
        // Ramp label: mono token role, quiet, with rhythm above and below.
        var label = document.createElement('span');
        label.className = 'text-code-label text-color-description';
        label.style.cssText = 'display:block;margin-block:var(--spacing-4) var(--spacing-2)';
        label.textContent = hue;
        ramps.appendChild(label);
        // One flex row of swatch cells (2px demo gap is tokenless geometry).
        var row = document.createElement('div');
        row.style.cssText = 'display:flex;gap:2px';
        hues[hue].forEach(function (step) {
          var fig = document.createElement('figure');
          fig.style.cssText = 'flex:1;margin:0';
          var cell = document.createElement('div');
          // 48px specimen height is tokenless demo geometry; fill is the primitive under test.
          cell.style.cssText = 'block-size:48px;border-radius:var(--radius-chip);border:var(--border-width) solid var(--color-border)';
          cell.style.background = 'var(--' + hue + '-' + step + ')';
          var cap = document.createElement('figcaption');
          cap.style.cssText = 'font-family:var(--font-code);font-size:10px;color:var(--color-text-subtle);text-align:center;margin-block-start:4px';
          cap.textContent = step;
          fig.appendChild(cell);
          fig.appendChild(cap);
          row.appendChild(fig);
        });
        ramps.appendChild(row);
      });
    })();
  </script>
  <script src="../preview.js"></script>
</body>
</html>
