<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bravoixr — icons</title>

  <script>
    (function () {
      var t = localStorage.getItem('bravoixr-theme') || 'light';
      var l = localStorage.getItem('bravoixr-lang') || 'en';
      var r = document.documentElement;
      r.setAttribute('data-theme', t);
      if (l === 'ar') { r.setAttribute('dir', 'rtl'); r.setAttribute('lang', 'ar'); }
      else { r.setAttribute('dir', 'ltr'); r.setAttribute('lang', 'en'); }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">

  <link rel="stylesheet" href="../../index.css">
  <link rel="stylesheet" href="../preview.css">
</head>
<body>
  <main class="pv-main">
    <div class="pv-topbar">
      <span class="text-context-title">bravoixr</span>
      <div class="pv-controls">
        <button class="btn btn-solid btn-square" type="button" data-toggle="theme" aria-label="Toggle theme"><span class="pv-symbol" style="font-size:var(--icon-md)">contrast</span></button>
        <button class="btn btn-solid btn-square" type="button" data-toggle="lang" aria-label="Toggle language"><span class="pv-symbol" style="font-size:var(--icon-md)">translate</span></button>
      </div>
    </div>

    <h2 style="font-family:var(--font-heading);font-weight:var(--weight-bold);font-size:var(--text-section-title);margin:0 0 var(--spacing-6)" data-en="Icons" data-ar="الأيقونات">Icons</h2>

    <section class="pv-section">
      <h3 data-en="Font" data-ar="الخط">Font</h3>
      <div class="pv-kv"><span class="pv-mono">--icon-font</span><span class="pv-val">'Material Symbols Rounded'</span></div>
    </section>

    <section class="pv-section">
      <h3 data-en="Size scale" data-ar="مقياس الأحجام">Size scale</h3>
      <div class="pv-icon-row">
        <span class="pv-symbol-prim" style="font-size:var(--icon-size-sm)">home</span>
        <span class="pv-symbol-prim" style="font-size:var(--icon-size-md)">favorite</span>
        <span class="pv-symbol-prim" style="font-size:var(--icon-size-lg)">settings</span>
        <span class="pv-symbol-prim" style="font-size:var(--icon-size-xl)">search</span>
      </div>
      <div class="pv-kv" style="margin-block-start:var(--spacing-5)"><span class="pv-mono">--icon-size-sm</span><span class="pv-val">16px</span></div>
      <div class="pv-kv"><span class="pv-mono">--icon-size-md</span><span class="pv-val">20px</span></div>
      <div class="pv-kv"><span class="pv-mono">--icon-size-lg</span><span class="pv-val">24px</span></div>
      <div class="pv-kv"><span class="pv-mono">--icon-size-xl</span><span class="pv-val">32px</span></div>
    </section>

    <section class="pv-section">
      <h3 data-en="Variable-font axes" data-ar="محاور الخط المتغيّر">Variable-font axes</h3>
      <div class="pv-kv"><span class="pv-mono">--icon-wght</span><span class="pv-val">400</span></div>
      <div class="pv-kv"><span class="pv-mono">--icon-fill</span><span class="pv-val">0</span></div>
      <div class="pv-kv"><span class="pv-mono">--icon-opsz-floor</span><span class="pv-val">20</span></div>
      <div class="pv-kv"><span class="pv-mono">--icon-grade-light</span><span class="pv-val">0</span></div>
      <div class="pv-kv"><span class="pv-mono">--icon-grade-dark</span><span class="pv-val">-25</span></div>
    </section>
  </main>

  <script src="../preview.js"></script>
</body>
</html>
