<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bravoixr — motion</title>

  <script>
    (function () {
      var t = localStorage.getItem('bravoixr-theme') || 'light';
      var l = localStorage.getItem('bravoixr-lang') || 'en';
      var r = document.documentElement;
      r.setAttribute('data-theme', t);
      if (l === 'ar') { r.setAttribute('dir', 'rtl'); r.setAttribute('lang', 'ar'); }
      else { r.setAttribute('dir', 'ltr'); r.setAttribute('lang', 'en'); }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">

  <link rel="stylesheet" href="../../index.css">
</head>
<body class="page text-body">
  <main class="page-body">
    <div class="page-topbar">
      <span class="text-project-title">bravoixr</span>
      <div class="page-controls">
        <button class="btn btn-solid btn-square" type="button" data-toggle="theme" aria-label="Toggle theme"><span class="icon icon-md">contrast</span></button>
        <button class="btn btn-solid btn-square" type="button" data-toggle="lang" aria-label="Toggle language"><span class="icon icon-md">translate</span></button>
      </div>
    </div>

    <h2 class="text-section-title" data-en="Motion" data-ar="الحركة">Motion</h2>

    <section class="page-section">
      <h3 class="text-minor-heading" data-en="Duration scale" data-ar="مقياس المدّة">Duration scale</h3>
      <div><span class="text-code-label text-color-helper">--duration-instant</span><span class="text-color-normal">0ms</span></div>
      <div><span class="text-code-label text-color-helper">--duration-fast</span><span class="text-color-normal">150ms</span></div>
      <div><span class="text-code-label text-color-helper">--duration-base</span><span class="text-color-normal">200ms</span></div>
      <div><span class="text-code-label text-color-helper">--duration-slow</span><span class="text-color-normal">300ms</span></div>
      <div><span class="text-code-label text-color-helper">--duration-slower</span><span class="text-color-normal">500ms</span></div>
    </section>

    <section class="page-section">
      <h3 class="text-minor-heading" data-en="Easing curves (hover a box)" data-ar="منحنيات التسارع (مرّر فوق مربع)">Easing curves (hover a box)</h3>
      <div>
        <div><div class="card" style="inline-size:80px;block-size:80px;transition:transform var(--duration-slower) var(--ease-standard)" data-motion-demo></div><span class="text-code-label text-color-helper">standard</span></div>
        <div><div class="card" style="inline-size:80px;block-size:80px;transition:transform var(--duration-slower) var(--ease-decelerate)" data-motion-demo></div><span class="text-code-label text-color-helper">decelerate</span></div>
        <div><div class="card" style="inline-size:80px;block-size:80px;transition:transform var(--duration-slower) var(--ease-accelerate)" data-motion-demo></div><span class="text-code-label text-color-helper">accelerate</span></div>
        <div><div class="card" style="inline-size:80px;block-size:80px;transition:transform var(--duration-slower) var(--ease-linear)" data-motion-demo></div><span class="text-code-label text-color-helper">linear</span></div>
      </div>
    </section>
  </main>

  <script src="../preview.js"></script>
</body>
</html>
