<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bravoixr — motion</title>

  <script>
    (function () {
      var t = localStorage.getItem('bravoixr-theme') || 'light';
      var l = localStorage.getItem('bravoixr-lang') || 'en';
      var r = document.documentElement;
      r.setAttribute('data-theme', t);
      if (l === 'ar') { r.setAttribute('dir', 'rtl'); r.setAttribute('lang', 'ar'); }
      else { r.setAttribute('dir', 'ltr'); r.setAttribute('lang', 'en'); }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">

  <link rel="stylesheet" href="../../index.css">
  <link rel="stylesheet" href="../preview.css">
</head>
<body>
  <main class="pv-main">
    <div class="pv-topbar">
      <span class="text-context-title">bravoixr</span>
      <div class="pv-controls">
        <button class="btn btn-solid btn-square" type="button" data-toggle="theme" aria-label="Toggle theme"><span class="pv-symbol" style="font-size:var(--icon-md)">contrast</span></button>
        <button class="btn btn-solid btn-square" type="button" data-toggle="lang" aria-label="Toggle language"><span class="pv-symbol" style="font-size:var(--icon-md)">translate</span></button>
      </div>
    </div>

    <h2 style="font-family:var(--font-heading);font-weight:var(--weight-bold);font-size:var(--text-section-title);margin:0 0 var(--spacing-6)" data-en="Motion" data-ar="الحركة">Motion</h2>

    <section class="pv-section">
      <h3 data-en="Duration scale" data-ar="مقياس المدّة">Duration scale</h3>
      <div class="pv-kv"><span class="pv-mono">--duration-instant</span><span class="pv-val">0ms</span></div>
      <div class="pv-kv"><span class="pv-mono">--duration-fast</span><span class="pv-val">150ms</span></div>
      <div class="pv-kv"><span class="pv-mono">--duration-base</span><span class="pv-val">200ms</span></div>
      <div class="pv-kv"><span class="pv-mono">--duration-slow</span><span class="pv-val">300ms</span></div>
      <div class="pv-kv"><span class="pv-mono">--duration-slower</span><span class="pv-val">500ms</span></div>
    </section>

    <section class="pv-section">
      <h3 data-en="Easing curves (hover a box)" data-ar="منحنيات التسارع (مرّر فوق مربع)">Easing curves (hover a box)</h3>
      <div class="pv-tiles">
        <div class="pv-tile"><div class="pv-motion-box" style="transition:transform var(--duration-slower) var(--ease-standard)"></div><span class="pv-mono">standard</span></div>
        <div class="pv-tile"><div class="pv-motion-box" style="transition:transform var(--duration-slower) var(--ease-decelerate)"></div><span class="pv-mono">decelerate</span></div>
        <div class="pv-tile"><div class="pv-motion-box" style="transition:transform var(--duration-slower) var(--ease-accelerate)"></div><span class="pv-mono">accelerate</span></div>
        <div class="pv-tile"><div class="pv-motion-box" style="transition:transform var(--duration-slower) var(--ease-linear)"></div><span class="pv-mono">linear</span></div>
      </div>
    </section>
  </main>

  <script src="../preview.js"></script>
</body>
</html>
