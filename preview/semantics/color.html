<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bravoixr — semantic color</title>

  <script>
    (function () {
      var t = localStorage.getItem('bravoixr-theme') || 'light';
      var l = localStorage.getItem('bravoixr-lang') || 'en';
      var r = document.documentElement;
      r.setAttribute('data-theme', t);
      if (l === 'ar') { r.setAttribute('dir', 'rtl'); r.setAttribute('lang', 'ar'); }
      else { r.setAttribute('dir', 'ltr'); r.setAttribute('lang', 'en'); }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">

  <link rel="stylesheet" href="../../index.css">
  <link rel="stylesheet" href="../preview.css">
</head>
<body>
  <header class="pv-header">
    <span class="pv-brand">bravoixr</span>
    <div class="pv-controls">
      <button class="pv-btn" type="button" data-toggle="theme">☾ Dark</button>
      <button class="pv-btn" type="button" data-toggle="lang">ع</button>
    </div>
  </header>

  <main class="pv-main">
    <h2 style="font-family:var(--font-heading);font-weight:var(--weight-page-title);font-size:var(--text-section-title);margin:0 0 var(--spacing-3)" data-en="Semantic color" data-ar="اللون الدلالي">Semantic color</h2>
    <p class="pv-lede" data-en="Role tokens, not raw colors — each maps onto a primitive and re-points by theme. Toggle ☾ Dark in the header and every swatch below recolors; components never touch the primitive ramps." data-ar="رموز أدوار، لا ألوان خام — كلٌّ يُسنَد إلى أوّليّة ويتغيّر مرجعه حسب السمة. بدّل إلى ☾ داكن من الأعلى فتتبدّل ألوان كل العيّنات أدناه؛ والمكوّنات لا تمسّ التدرّجات الأوّليّة إطلاقًا.">Role tokens, not raw colors — each maps onto a primitive and re-points by theme. Toggle ☾ Dark in the header and every swatch below recolors; components never touch the primitive ramps.</p>

    <section class="pv-section">
      <h3 data-en="Brand" data-ar="العلامة">Brand</h3>
      <div class="pv-color-row" data-base="--color-primary" data-label="primary"></div>
      <div class="pv-color-row" data-base="--color-secondary" data-label="secondary"></div>
    </section>

    <section class="pv-section">
      <h3 data-en="Status" data-ar="الحالة">Status</h3>
      <div class="pv-color-row" data-base="--color-success" data-label="success"></div>
      <div class="pv-color-row" data-base="--color-warning" data-label="warning"></div>
      <div class="pv-color-row" data-base="--color-error" data-label="error"></div>
      <div class="pv-color-row" data-base="--color-info" data-label="info"></div>
    </section>

    <section class="pv-section">
      <h3 data-en="Surfaces" data-ar="الأسطح">Surfaces</h3>
      <div class="pv-swatches" data-roles="--color-surface-page,--color-surface-raised,--color-surface-sunken"></div>
    </section>

    <section class="pv-section">
      <h3 data-en="Text" data-ar="النص">Text</h3>
      <div class="pv-swatches" data-roles="--color-text,--color-text-muted,--color-text-subtle,--color-text-inverse,--color-text-on-primary"></div>
    </section>

    <section class="pv-section">
      <h3 data-en="Border" data-ar="الحدود">Border</h3>
      <div class="pv-swatches" data-roles="--color-border,--color-border-strong,--color-border-focus"></div>
    </section>
  </main>

  <script>
    (function () {
      function swatch(role, caption, captionMono) {
        var sw = document.createElement('div');
        sw.className = 'pv-swatch';
        var cell = document.createElement('div');
        cell.className = 'pv-cell';
        cell.style.background = 'var(' + role + ')';
        var name = document.createElement('span');
        name.className = captionMono ? 'pv-name pv-mono' : 'pv-name';
        name.textContent = caption;
        sw.appendChild(cell);
        sw.appendChild(name);
        return sw;
      }

      // Stateless variant families (Surfaces, Text, Border) — flat swatch grid.
      document.querySelectorAll('.pv-swatches[data-roles]').forEach(function (grid) {
        grid.getAttribute('data-roles').split(',').forEach(function (role) {
          grid.appendChild(swatch(role, role, true));
        });
      });

      // State families (Brand, Status) — one row per family, states laid horizontally.
      var states = [['', 'normal'], ['-hover', 'hover'], ['-active', 'active']];
      document.querySelectorAll('.pv-color-row[data-base]').forEach(function (row) {
        var base = row.getAttribute('data-base');
        var meta = document.createElement('div');
        meta.className = 'pv-type-meta';
        var label = document.createElement('strong');
        label.textContent = row.getAttribute('data-label');
        var token = document.createElement('span');
        token.className = 'pv-mono';
        token.textContent = base;
        meta.appendChild(label);
        meta.appendChild(token);

        var group = document.createElement('div');
        group.className = 'pv-color-states';
        states.forEach(function (s) {
          group.appendChild(swatch(base + s[0], s[1], false));
        });

        row.appendChild(meta);
        row.appendChild(group);
      });
    })();
  </script>
  <script src="../preview.js"></script>
</body>
</html>
