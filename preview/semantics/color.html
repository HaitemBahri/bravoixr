<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bravoixr — semantic color</title>

  <script>
    (function () {
      var t = localStorage.getItem('bravoixr-theme') || 'light';
      var l = localStorage.getItem('bravoixr-lang') || 'en';
      var r = document.documentElement;
      r.setAttribute('data-theme', t);
      if (l === 'ar') { r.setAttribute('dir', 'rtl'); r.setAttribute('lang', 'ar'); }
      else { r.setAttribute('dir', 'ltr'); r.setAttribute('lang', 'en'); }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">

  <link rel="stylesheet" href="../../index.css">
  <link rel="stylesheet" href="../preview.css">
</head>
<body>
  <main class="pv-main">
    <div class="pv-topbar">
      <span class="text-context-title">bravoixr</span>
      <div class="pv-controls">
        <button class="btn btn-solid btn-square" type="button" data-toggle="theme" aria-label="Toggle theme"><span class="pv-symbol" style="font-size:var(--icon-md)">contrast</span></button>
        <button class="btn btn-solid btn-square" type="button" data-toggle="lang" aria-label="Toggle language"><span class="pv-symbol" style="font-size:var(--icon-md)">translate</span></button>
      </div>
    </div>

    <h2 style="font-family:var(--font-heading);font-weight:var(--weight-page-title);font-size:var(--text-section-title);margin:0 0 var(--spacing-3)" data-en="Semantic color" data-ar="اللون الدلالي">Semantic color</h2>
    <p class="pv-lede" data-en="Role tokens, not raw colors — each maps onto a primitive and re-points by theme. Toggle ☾ Dark from the top and every swatch below recolors; components never touch the primitive ramps." data-ar="رموز أدوار، لا ألوان خام — كلٌّ يُسنَد إلى أوّليّة ويتغيّر مرجعه حسب السمة. بدّل إلى ☾ داكن من الأعلى فتتبدّل ألوان كل العيّنات أدناه؛ والمكوّنات لا تمسّ التدرّجات الأوّليّة إطلاقًا.">Role tokens, not raw colors — each maps onto a primitive and re-points by theme. Toggle ☾ Dark from the top and every swatch below recolors; components never touch the primitive ramps.</p>

    <section class="pv-section">
      <h3 data-en="Brand" data-ar="العلامة">Brand</h3>
      <div class="pv-color-row" data-base="--color-primary" data-label="primary"></div>
      <div class="pv-color-row" data-base="--color-secondary" data-label="secondary"></div>
    </section>

    <section class="pv-section">
      <h3 data-en="Status" data-ar="الحالة">Status</h3>
      <div class="pv-color-row" data-base="--color-success" data-label="success"></div>
      <div class="pv-color-row" data-base="--color-warning" data-label="warning"></div>
      <div class="pv-color-row" data-base="--color-error" data-label="error"></div>
      <div class="pv-color-row" data-base="--color-info" data-label="info"></div>
    </section>

    <section class="pv-section">
      <h3 data-en="Surfaces" data-ar="الأسطح">Surfaces</h3>
      <div class="pv-color-row" data-label="surfaces" data-roles="--color-surface-page:page,--color-surface-raised:raised,--color-surface-sunken:sunken"></div>
    </section>

    <section class="pv-section">
      <h3 data-en="Text" data-ar="النص">Text</h3>
      <div class="pv-color-row" data-label="text" data-roles="--color-text:text,--color-text-muted:muted,--color-text-subtle:subtle,--color-text-inverse:inverse,--color-text-on-primary:on-primary"></div>
    </section>

    <section class="pv-section">
      <h3 data-en="Border" data-ar="الحدود">Border</h3>
      <div class="pv-color-row" data-label="border" data-roles="--color-border:border,--color-border-strong:strong,--color-border-focus:focus"></div>
    </section>
  </main>

  <script>
    (function () {
      // Each swatch is captioned with its role label and, under it, its var name.
      function swatch(role, caption) {
        var sw = document.createElement('div');
        sw.className = 'pv-swatch';
        var cell = document.createElement('div');
        cell.className = 'pv-cell';
        cell.style.background = 'var(' + role + ')';
        var name = document.createElement('span');
        name.className = 'pv-name';
        name.textContent = caption;
        var token = document.createElement('span');
        token.className = 'pv-name pv-mono';
        token.textContent = role;
        sw.appendChild(cell);
        sw.appendChild(name);
        sw.appendChild(token);
        return sw;
      }

      // One row per family: a name meta column, then its swatches laid out
      // horizontally. `pairs` is [role, caption] entries.
      function buildRow(row, pairs) {
        var meta = document.createElement('div');
        meta.className = 'pv-type-meta';
        var label = document.createElement('strong');
        label.textContent = row.getAttribute('data-label');
        meta.appendChild(label);

        var group = document.createElement('div');
        group.className = 'pv-color-states';
        pairs.forEach(function (p) { group.appendChild(swatch(p[0], p[1])); });

        row.appendChild(meta);
        row.appendChild(group);
      }

      // State families (Brand, Status): base token + normal/hover/active steps.
      var states = [['', 'normal'], ['-hover', 'hover'], ['-active', 'active']];
      document.querySelectorAll('.pv-color-row[data-base]').forEach(function (row) {
        var base = row.getAttribute('data-base');
        buildRow(row, states.map(function (s) { return [base + s[0], s[1]]; }));
      });

      // Variant families (Surfaces, Text, Border): explicit `token:caption` list.
      document.querySelectorAll('.pv-color-row[data-roles]').forEach(function (row) {
        var pairs = row.getAttribute('data-roles').split(',').map(function (r) {
          return r.split(':');
        });
        buildRow(row, pairs);
      });
    })();
  </script>
  <script src="../preview.js"></script>
</body>
</html>
